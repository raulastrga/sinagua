name: Daily Data Recovery

on:
  schedule:
    - cron: '30 18 * * *' # Ejecuta todos los días a las 12:30 PM hora de Culiacán (UTC-7)
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

permissions:
  contents: write

jobs:
  recover-missing-days-actual-month:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Recover missing days from actual month
        run: |
          node scripts/revisar_dias_faltantes_mes_actual.js

      - name: Upload diagnostics (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-data
          path: data/debug
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update: Daily data recovery" || echo "No changes to commit"
          git push
